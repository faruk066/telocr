# Render Blueprint: https://render.com/docs/blueprint-spec
# Kullanım: repo'ya push'la → Render Dashboard → New → Blueprint → render.yaml'ı seç.
# Env değerlerini Dashboard'dan gir (TELEGRAM_BOT_TOKEN, GEMINI_API_KEY, NVIDIA_API_KEY).
services:
  - type: worker
    name: telocr-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: moonshotai/kimi-k3
      - key: AI_PROVIDER_ORDER
        value: gemini,nvidia
      - key: NVIDIA_TIMEOUT_S
        value: "600"
      - key: NVIDIA_IMAGE_MAX_LONG_EDGE
        value: "1280"
      - key: NVIDIA_IMAGE_JPEG_QUALITY
        value: "80"
      - key: NVIDIA_MAX_TOKENS
        value: "16384"
      - key: NVIDIA_TEMPERATURE
        value: "1"
      - key: NVIDIA_SEED
        value: "0"
      - key: NVIDIA_REASONING_EFFORT
        value: low
      - key: NVIDIA_FALLBACK_REASONING_EFFORT
        value: low
